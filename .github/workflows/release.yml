name: Modern beta release draft

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build verified Modern beta artifacts
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify canonical version and optional tag
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ('${{ github.ref_type }}' -eq 'tag') {
            $expected = "v$version"
            if ('${{ github.ref_name }}' -ne $expected) {
              throw "Tag '${{ github.ref_name }}' does not match VERSION '$version' (expected '$expected')"
            }
          }
          ./scripts/verify-version.ps1 -Version $version

      - name: Verify core (Go 1.20)
        shell: pwsh
        run: ./scripts/test-core.ps1 -Go (Get-Command go).Source -BuildCache ci-go120-release -AllowNativeWrites

      - name: Go 1.26 for Modern
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false

      - name: Install pinned Wails v3.1.0
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Wails install failed' }
          New-Item -ItemType Directory -Force -Path cache/tools/wails-3.1 | Out-Null
          Copy-Item -LiteralPath (Join-Path (go env GOPATH) 'bin/wails3.exe') -Destination cache/tools/wails-3.1/wails3.exe

      - name: Full Modern build
        shell: pwsh
        run: ./scripts/build-modern.ps1 -Wails cache/tools/wails-3.1/wails3.exe -InstallDependencies

      - name: Package beta artifacts and verify SHA-256
        shell: pwsh
        run: ./scripts/package-modern-release.ps1 -SkipBuild

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windeploy-beta-release
          path: |
            dist/WinDeploy-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/WinDeploy-*-portable-x64.zip

      - name: Create draft pre-release (never public automatically)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          generate_release_notes: false
          body_path: dist/RELEASE-NOTES.md
          name: WinDeploy ${{ github.ref_name }} — Public Beta
          files: |
            dist/WinDeploy-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/WinDeploy-*-portable-x64.zip
