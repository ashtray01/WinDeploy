name: Modern CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core Go 1.20 amd64+386
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Core tests, vet and builds
        shell: pwsh
        run: ./scripts/test-core.ps1 -Go (Get-Command go).Source -BuildCache ci-go120 -AllowNativeWrites
      - name: Build core CLIs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          foreach ($arch in @('amd64','386')) {
            $env:GOARCH = $arch
            foreach ($cmd in @('windeploy-inspect','windeploy-packages','windeploy-run')) {
              go build -trimpath -o "bin/$cmd-$arch.exe" "./cmd/$cmd"
              if ($LASTEXITCODE -ne 0) { throw "build failed: $cmd $arch" }
            }
          }

  modern:
    name: Modern Go 1.26 + React
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Version identity
        shell: pwsh
        run: ./scripts/verify-version.ps1
      - name: Frontend typecheck, tests and build
        working-directory: desktop/modern/frontend
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm run typecheck
          if ($LASTEXITCODE -ne 0) { throw 'typecheck failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'frontend tests failed' }
          npm run build
          if ($LASTEXITCODE -ne 0) { throw 'frontend build failed' }
      - name: Go service tests and vet
        working-directory: desktop/modern
        shell: pwsh
        run: |
          go test ./... -count=1
          if ($LASTEXITCODE -ne 0) { throw 'modern Go tests failed' }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw 'modern vet failed' }

  modern-build:
    name: Modern Wails EXE and release dry-run
    needs: modern
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned Wails v3.1.0
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          if ($LASTEXITCODE -ne 0) { throw 'Wails install failed' }
          New-Item -ItemType Directory -Force -Path cache/tools/wails-3.1 | Out-Null
          Copy-Item -LiteralPath (Join-Path (go env GOPATH) 'bin/wails3.exe') -Destination cache/tools/wails-3.1/wails3.exe
      - name: Full Modern build
        shell: pwsh
        run: ./scripts/build-modern.ps1 -Wails cache/tools/wails-3.1/wails3.exe -InstallDependencies
      - name: Package beta artifacts and checksums
        shell: pwsh
        run: ./scripts/package-modern-release.ps1 -SkipBuild
      - name: Upload EXE, checksums and portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: windeploy-modern-beta
          path: |
            dist/WinDeploy-Windows-x64.exe
            dist/SHA256SUMS.txt
            dist/RELEASE-NOTES.md
            dist/WinDeploy-*-portable-x64.zip
