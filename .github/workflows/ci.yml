name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    name: Core Go 1.20 amd64+386
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Core tests, vet and builds
        shell: pwsh
        run: ./scripts/test-core.ps1 -Go (Get-Command go).Source -BuildCache ci-go120
      - name: Build core CLIs
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          foreach ($arch in @('amd64','386')) {
            $env:GOARCH = $arch
            foreach ($cmd in @('windeploy-inspect','windeploy-packages','windeploy-run')) {
              go build -trimpath -o "bin/$cmd-$arch.exe" "./cmd/$cmd"
            }
          }

  legacy:
    name: Legacy Go 1.20 Win32 x64/x86
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20.14'
          cache: false
      - name: Legacy test, selftest and builds
        shell: pwsh
        run: ./scripts/build-legacy.ps1 -Go (Get-Command go).Source
      - uses: actions/upload-artifact@v4
        with:
          name: legacy-binaries
          path: |
            bin/WinDeploy-Legacy-Windows-x64.exe
            bin/WinDeploy-Legacy-Windows-x86.exe

  modern:
    name: Modern Go 1.26 + React
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Frontend typecheck, tests and build
        working-directory: desktop/modern/frontend
        shell: pwsh
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Go service tests and vet
        working-directory: desktop/modern
        shell: pwsh
        run: |
          go test ./...
          go vet ./...

  modern-build:
    name: Modern Wails EXE
    needs: modern
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.2'
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Wails v3.1.0
        shell: pwsh
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.1.0
          New-Item -ItemType Directory -Force -Path cache/tools/wails-3.1 | Out-Null
          Copy-Item -LiteralPath (Join-Path (go env GOPATH) 'bin/wails3.exe') -Destination cache/tools/wails-3.1/wails3.exe
      - name: Full Modern build
        shell: pwsh
        run: ./scripts/build-modern.ps1 -Wails cache/tools/wails-3.1/wails3.exe -InstallDependencies
      - uses: actions/upload-artifact@v4
        with:
          name: modern-binary
          path: bin/WinDeploy-Windows-x64.exe
